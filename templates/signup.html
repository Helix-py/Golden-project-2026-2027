<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitty -Signup</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='signup.css') }}">
    <link rel="icon" type="image/png" href="/static/pics/favicon.png">


</head>
<body>

    <h1>Hello new user</h1>
</body>

<div class="signup-box">
    <h1>sign-up</h1>

    <form action="{{ url_for('signup') }}" method="POST">

    <p>username</p>
    <input
        type="text"
        id="username"
        name="username"
        placeholder="make your username"
        >

    <p>password</p>
    <input
        type="password"
        id="password"
        name="password"
        placeholder="make your password"
        >

    <button type="submit">sign-up</button>

    <p>
        have an account?
        <a href="{{ url_for('login') }}">login</a>
    </p>

    <p>
        don't want to save your data?
        <a href="{{ url_for('join_guest') }}" class="btn"> <br> Join as Guest</a>
    </p>

    </form>

</div>
</html>
