<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings</title>
    <link rel="stylesheet" href="{{ url_for('static',filename='settings.css') }}">
</head>
<body>

    <div class="settings-container">
        <!-- Sidebar Navigation -->
        <aside class="settings-sidebar">
            <h2>Settings</h2>
            <nav>
                <ul>
                    <li><a href="#" class="active">Profile</a></li>
                    <li><a href="#">Account Security</a></li>
                    <li><a href="#">Notifications</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Main Settings Content -->
        <main class="settings-content">
            <section class="settings-section">
                <h3>Public Profile</h3>
                <p class="section-desc">Manage how your information appears publicly.</p>

                <form>
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" value="johndoe123">
                    </div>

                    <div class="form-group">
                        <label for="bio">Bio</label>
                        <textarea id="bio" rows="4">Web developer based in Wisconsin.</textarea>
                    </div>

                    <div class="form-game_scores">
                        <label for="gamescores">see your scores here!</label>
                        <!-- Uses a span or div with a unique ID to hold the score -->
                        <span id="gamescores">0</span>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="button button-primary">Save Changes</button>
                        <button type="button" class="button button-secondary">Cancel</button>
                    </div>
                </form>
            </section>
        </main>
    </div>

</body>
</html>
